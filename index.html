<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->



  <title>Frontend Mentor | Advice generator app</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&family=Manrope:wght@200..800&display=swap"
    rel="stylesheet">

</head>

<body>
  <!-- Advice ID goes here-->
  <main class="page">
    <article class="advice-card">
      <p class="
      advice-label" id="advice-heading"> ADVICE # <span id="advice-id">117</span></p>

      <blockquote class="advice-text" id="advice-text">
        "it is easy to sit up ad take notice, what's difficult is getting up and taking action "

      </blockquote>
      <picture class="divider">
        <source media="(max-width:600px)" srcset="./images/pattern-divider-desktop.svg" />
        <img src="./images/pattern-divider-desktop.svg" alt="pattern divider" />

      </picture>
      <button class="dice-button" id="generate-advice" type="button">
        <img src="./images/icon-dice.svg" alt="dice" />
      </button>
    </article>
  </main>
  <!-- this is the script -->
  <script src="./script.js">

  </script>
</body>

</html>
